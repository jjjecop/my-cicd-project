name: Secure CI/CD Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    sast-scan:
        name: SAST scan (Bandit)
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code 
                uses: actions/checkout@v4
                
            -   name: set up Python
                uses: actions/setup-python@v5
                with:
                    python-version: "3.11"

            -   name: install Bandit
                run: pip Install Bandit

            -   name: Run Bandit scan
                run: bandit -r app/ -f screen

    dependency-scan: 
        name: Dependency scan (Trivy)
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Run Trivy filesystem scan
                uses: aquasecurity/trivy-action@v0.24.0
                with: 
                    scan-type: "fs"
                    scan-ref: "app/requirements.txt"
                    severity: "CRITICAL,HIGH"
                    exit-code: "0"

    build-and-scan-image:
        name: Build & scan Docker image
        runs-on: ubuntu-latest
        needs: [sast-scan, dependency-scan]
        steps:
            -   name: Checkout code
                uses: actions/checkout@v4

            -   name: Build Docker image
                run: docker build -t secure-cicd-demo:latest . 

            -   name: Run Trivy image scan 
                uses: aquasecurity/trivy-action@v0.24.0
                with: 
                    image-ref: "secure-cicd-demo:latest"
                    severity: "CRITICAL,HIGH"
                    exit-code: "0"
